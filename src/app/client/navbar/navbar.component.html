<!-- Navbar Component Template -->
<nav class="navbar">
  <div class="navbar-container">
    <div class="navbar-left">
      <div class="navbar-brand">
        <!-- Default Brand -->
        <div *ngIf="!currentBoutique" class="default-brand" >
          <h1 (click)="navigateToBoutique()">MonMarché</h1>
        </div>
        <!-- Dynamic Boutique Brand -->
        <div *ngIf="currentBoutique" class="boutique-brand">
          <img [src]="currentBoutique.logo" [alt]="currentBoutique.nom" class="brand-logo">
          <span class="brand-name">{{ currentBoutique.nom }}</span>
        </div>
      </div>
      
      <!-- Desktop Navigation -->
      <div class="navbar-nav">
        <ng-container *ngFor="let item of menuItems">
          <a *ngIf="item.path" [routerLink]="item.path" routerLinkActive="active">
            <span class="nav-icon">{{item.icon}}</span>
            <span class="nav-label">{{item.label}}</span>
          </a>
          <a *ngIf="item.action" (click)="item.action()" routerLinkActive="active" style="cursor: pointer;">
            <span class="nav-icon">{{item.icon}}</span>
            <span class="nav-label">{{item.label}}</span>
          </a>
        </ng-container>
      </div>

      <!-- Mobile Menu Toggle -->
      <button class="mobile-menu-toggle" (click)="toggleMobileMenu()" [class.active]="isMobileMenuOpen">
        <div class="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </button>
    </div>

    <div class="navbar-actions">
      <button class="panier-btn" (click)="goToPanier()">
        <i class="icon-cart">🛒</i>
        <span class="badge" *ngIf="nombreItemsPanier > 0">{{nombreItemsPanier}}</span>
      </button>

      <!-- User Menu (Authenticated) -->
      <div class="user-menu" *ngIf="currentUser">
        <div class="dropdown">
          <button class="user-btn" (click)="toggleMenu()" [class.open]="isMenuOpen">
            <i class="icon-user">👤</i>
            <span>{{currentUser?.prenom}} {{currentUser?.nom}}</span>
            <i class="icon-arrow">▼</i>
          </button>
          <div class="dropdown-menu" [class.open]="isMenuOpen">
            <a routerLink="/client/historique">Mon Profil</a>
            <button (click)="logout()">Déconnexion</button>

          </div>
        </div>
      </div>

      <!-- Guest Menu (Unauthenticated) -->
      <div class="guest-menu" *ngIf="!currentUser">
        <div class="dropdown">
          <button class="login-btn" (click)="toggleGuestMenu()" [class.open]="isGuestMenuOpen">
            <span>🔒 Accès Client</span>
          </button>
          <div class="dropdown-menu" [class.open]="isGuestMenuOpen">
            <div class="preview-header">En tant que client, vous aurez accès à :</div>
            <span *ngFor="let label of userMenuLabelsPreview" class="preview-item">- {{ label }}</span>
            <div class="dropdown-divider"></div>
            <button class="login-action-btn" (click)="goToLogin()">Se connecter</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>

<!-- Mobile Menu Overlay -->
<div class="mobile-nav-overlay" 
     [class.active]="isMobileMenuOpen" 
     (click)="closeMobileMenu()"
     *ngIf="isMobileMenuOpen">
</div>

<!-- Mobile Navigation Menu -->
<div class="mobile-nav-menu" [class.active]="isMobileMenuOpen">
  <div class="mobile-nav-items">
    <ng-container *ngFor="let item of menuItems">
      <a *ngIf="item.path" 
         [routerLink]="item.path" 
         routerLinkActive="active"
         (click)="closeMobileMenu()">
        <span class="nav-icon">{{item.icon}}</span>
        <span class="nav-label">{{item.label}}</span>
      </a>
      <a *ngIf="item.action" 
         (click)="item.action(); closeMobileMenu()" 
         style="cursor: pointer;">
        <span class="nav-icon">{{item.icon}}</span>
        <span class="nav-label">{{item.label}}</span>
      </a>
    </ng-container>
  </div>

  <div class="mobile-actions">
    <!-- Mode utilisateur connecté -->
     
    <div *ngIf="currentUser" class="mobile-user-section">
                <button class="mobile-action-btn mobile-profil-btn"(click)="goToProfil()">{{currentUser?.prenom}}  {{currentUser?.nom}}</button>
      <button class="mobile-action-btn mobile-logout-btn" (click)="logout()">
        🚪 Déconnexion
      </button>
    </div>

    <!-- Mode invité -->
    <div *ngIf="!currentUser" class="mobile-guest-section">
      <div class="mobile-preview">
        <div class="preview-header">En tant que client, vous aurez accès à :</div>
        <div *ngFor="let label of userMenuLabelsPreview" class="preview-item">- {{ label }}</div>
      </div>
      <button class="mobile-action-btn mobile-login-btn" (click)="goToLogin()">
        🔒 Se connecter
      </button>
    </div>
  </div>
</div>
