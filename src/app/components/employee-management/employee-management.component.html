
<div class="page-wrapper">
  <div class="product-management-container">
  <div class="product-header">
    <div class="header-content">
      <h2 class="section-title">
        <span class="product-icon">📦</span> Gestion <span class="highlight">Produits</span>
      </h2>
      <div class="action-buttons">
        <button class="btn btn-add" (click)="openAddModal()">
          <span class="btn-icon">➕</span> Nouveau produit
        </button>
        <button class="btn btn-delete" (click)="openDeleteModal()">
          <span class="btn-icon">🗑️</span> Supprimer
        </button>
      </div>
    </div>
  </div>

  <div class="product-table-container">
    <table class="product-table">
      <thead>
        <tr>
          <th class="checkbox-column">
            <input type="checkbox" [(ngModel)]="selectAll" (change)="toggleAllSelection()" />
          </th>
          <th>Libellé</th>
          <th>Catégorie</th>
          <th>Prix</th>
          <th>Stock</th>
          <th class="actions-column">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of products" class="product-row">
          <td class="checkbox-column">
            <input type="checkbox" [(ngModel)]="p.selected" (change)="onCheckboxChange()" />
          </td>
          <td class="product-name">{{ p.name }}</td>
          <td>
            <span class="category-badge">{{ p.category }}</span>
          </td>
          <td class="price">{{ p.price }} FCFA</td>
          <td>
            <span class="stock-badge" [class.low-stock]="p.quantity < 5">
              {{ p.quantity }}
            </span>
          </td>
          <td class="actions-column">
            <button class="btn-action btn-edit" (click)="openEditModal(p)">
              <span class="action-icon">✏️</span>
            </button>
            <button class="btn-action btn-delete" (click)="confirmDelete(p)">
              <span class="action-icon">🗑️</span>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- MODAL -->
  <div *ngIf="showModal" class="modal-overlay">
    <div class="product-modal">
      <h3 class="modal-title">
        {{ editingProduct ? 'Modifier le produit' : 'Ajouter un produit' }}
      </h3>
      
      <form (ngSubmit)="saveProduct()" class="product-form">
        <div class="form-group">
          <label>Libellé</label>
          <input class="form-input" [(ngModel)]="modalData.name" name="name" required />
        </div>
        
        <div class="form-group">
          <label>Catégorie</label>
          <input class="form-input" [(ngModel)]="modalData.category" name="category" required />
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>Prix (FCFA)</label>
            <input class="form-input" [(ngModel)]="modalData.price" name="price" type="number" required />
          </div>
          
          <div class="form-group">
            <label>Quantité</label>
            <input class="form-input" [(ngModel)]="modalData.quantity" name="quantity" type="number" required />
          </div>
        </div>
        
        <div class="modal-actions">
          <button type="button" class="btn btn-cancel" (click)="closeModal()">Annuler</button>
          <button type="submit" class="btn btn-save">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>
</div>
</div>
