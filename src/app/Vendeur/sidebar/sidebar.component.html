
<section id="sidebar" [ngClass]="{'sidebar-collapsed': isCollapsed, 'show': !isCollapsed && isMobileView}">
  <div class="brand" style="cursor: pointer;">
    <i class="bi bi-emoji-smile" aria-hidden="true"></i>
    <span class="ms-2" *ngIf="!isCollapsed">Admin</span>
  </div>
  
  <ul *ngFor="let section of sections" class="side-menu">
    <li *ngFor="let item of menuItems[section]">
      <a [routerLink]="item.route" routerLinkActive="active">
        <i [class]="item.icon"></i>
        <span>{{ item.label }}</span>
      </a>
    </li>
  </ul>
  <button class="btn btn-danger" (click)="logout()">Déconnexion</button>    
</section>
