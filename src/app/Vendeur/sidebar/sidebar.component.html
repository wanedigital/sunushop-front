<section id="sidebar" [ngClass]="{'sidebar-collapsed': isCollapsed, 'show': !isCollapsed && isMobileView}">
  <!-- Brand Section avec animation -->
  <div class="brand" (click)="toggleSidebar()" style="cursor: pointer;">
    <i class="bi bi-emoji-smile" aria-hidden="true"></i>
    <span class="ms-2" *ngIf="!isCollapsed">Vendeur Pro</span>
  </div>

  <!-- Menu Principal (Top Section) -->
  <ul class="side-menu" *ngIf="menuItems.top.length > 0">
    <li *ngFor="let item of menuItems.top; trackBy: trackByFn" 
        [ngClass]="{'active': item.isActive}">
      <a [routerLink]="item.route" 
         routerLinkActive="active"
         [routerLinkActiveOptions]="{exact: false}"
         (click)="setActiveItem(item)">
        <i [class]="item.icon" aria-hidden="true"></i>
        <span>{{ item.label }}</span>
      </a>
    </li>
  </ul>

  <!-- Séparateur visuel -->
  <div class="sidebar-divider" *ngIf="menuItems.bottom.length > 0"></div>

  <!-- Menu Secondaire (Bottom Section) -->
  <ul class="side-menu bottom-menu" *ngIf="menuItems.bottom.length > 0">
    <li *ngFor="let item of menuItems.bottom; trackBy: trackByFn">
      <!-- Cas spécial pour le logout -->
      <a *ngIf="item.label === 'Logout'" 
         (click)="logout()" 
         class="logout-link"
         style="cursor: pointer;">
        <i [class]="item.icon" aria-hidden="true"></i>
        <span>{{ item.label }}</span>
      </a>
      <!-- Autres liens -->
      <a *ngIf="item.label !== 'Logout'" 
         [routerLink]="item.route" 
         routerLinkActive="active"
         [routerLinkActiveOptions]="{exact: false}"
         (click)="setActiveItem(item)">
        <i [class]="item.icon" aria-hidden="true"></i>
        <span>{{ item.label }}</span>
      </a>
    </li>
  </ul>

  <!-- Footer du sidebar (optionnel) -->
  <div class="sidebar-footer" *ngIf="!isCollapsed && currentUser">
    <div class="user-info">
      <div class="user-avatar">
        <i class="bi bi-person-circle"></i>
      </div>
      <div class="user-details">
        <span class="user-name">{{ currentUser.prenom }}</span>
        <span class="user-username">{{ currentUser.nom }}</span>
      </div>
    </div>
  </div>
</section>

<!-- Overlay pour mobile -->
<div class="sidebar-overlay" 
     *ngIf="isMobileView && !isCollapsed" 
     (click)="closeSidebar()">
</div>
