<div class="table-data">
  <div class="table-header">
    <h4>Liste des Produits</h4>
<div class="table-actions">
  <input
    type="text"
    placeholder="Rechercher..."
    [(ngModel)]="searchQuery"
    (input)="onSearchInput()"
    class="search-input"
  />
  <select [(ngModel)]="itemsPerPage" (change)="changeItemsPerPage()" class="page-select">
    <option value="5">5 par page</option>
    <option value="10">10 par page</option>
    <option value="20">20 par page</option>
    <option value="50">50 par page</option>
  </select>
</div>
  </div>

  <div *ngIf="isLoading" class="loading-indicator">
    Chargement en cours...
  </div>

  <div class="overflow-auto rounded-xl shadow-md">
    <table class="table table-hover align-middle w-full text-left border-collapse bg-white">
      <thead class="bg-[#04192F] text-white">
        <tr>
          <th class="px-6 py-3 whitespace-nowrap">Libellé</th>
          <th class="px-6 py-3 whitespace-nowrap">Description</th>
          <th class="px-6 py-3 whitespace-nowrap">Prix</th>
          <th class="px-6 py-3 whitespace-nowrap">Quantité</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let produit of filteredProduits" class="hover:bg-[#157CEA]/10 transition">
          <td class="px-6 py-4 border-t">{{ produit.libelle }}</td>
          <td class="px-6 py-4 border-t">{{ produit.description }}</td>
          <td class="px-6 py-4 border-t">{{ produit.prix | currency:'EUR':'symbol':'1.2-2' }}</td>
          <td class="px-6 py-4 border-t">{{ produit.quantite }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="pagination-container">
    <div class="pagination-controls">
      <button (click)="changePage(1)" [disabled]="currentPage === 1" class="page-nav">
        «
      </button>
      <button (click)="changePage(currentPage - 1)" [disabled]="currentPage === 1" class="page-nav">
        ‹
      </button>

      <button *ngFor="let page of getPages()" 
              (click)="changePage(page)"
              [class.active]="page === currentPage"
              class="page-number">
        {{ page }}
      </button>

      <button (click)="changePage(currentPage + 1)" 
              [disabled]="currentPage === totalPages" 
              class="page-nav">
        ›
      </button>
      <button (click)="changePage(totalPages)" 
              [disabled]="currentPage === totalPages" 
              class="page-nav">
        »
      </button>
    </div>
    <div class="pagination-info">
      Page {{currentPage}} sur {{totalPages}} - {{totalItems}} produits
    </div>
  </div>
</div>
