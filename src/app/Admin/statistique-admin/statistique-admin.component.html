        </div>
      </div>

      <div class="card-single">
        <div>
          <h2>+130</h2>
          <small>Stock</small>
        </div>

          <img src="assets/stock.jpeg" alt="Stock" class="img_card">
        </div>
      </div>

      <div class="card-single">
        <div>
          <h2>5</h2>

        <div>
          <img src="assets/fournisseur.jpeg" alt="Fournisseur" class="img_card">

      <div class="card-single">
        <div>

        <div>
          <img src="assets/communaute.jpeg" alt="Communauté" class="img_card">
        </div>
      </div>
    </div>

    <!-- Components Section -->
    <div class="composant">
      <!-- Clients List -->
      <div class="ventes">
        <div class="case">
          <div class="header-case">
            <h2>Nos Clients Fidels</h2>
          </div>
          <div class="body-case">
            <table>
              <thead>
              <tr>
                <td>Prenom</td>
                <td>Nom</td>
                <td>Email</td>
                <td>Numero de telephone</td>
              </tr>
              </thead>
              <tbody>
              <tr >
                <td>prenom</td>
                <td>nom</td>
                <td>email</td>
                <td>telephone</td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Commandes List -->
      <div class="card shadow-sm">
        <div class="card-header bg-transparent border-0">
          <h3>Listes Commandes</h3>
        </div>
        <div class="card-body">

          <div class="search-wrapper">
            <input type="text" id="searchId"  placeholder="Search by ID" class="form-control"/>
            <button class="btnFiltre" >Apply Filter</button>
          </div>
          <br>
          <button class="btnActualise" >Actualiser</button>
          <br>
          <br>
          <!-- Commandes Table -->
          <table class="table table-bordered">
            <thead class="thead-dark">
            <tr>
              <th>Client</th>
              <th>Date Livraison</th>
              <th>Date Commande</th>
              <th>Total</th>
              <th>Status</th>
            </tr>
            </thead>
            <tbody>
            <tr >
              <td>email </td>
              <td>
                <input
                  type="date"
                  
                />
              </td>
              <td>date de commande</td>
              <td>total</td>
              <td>
                <select  class="form-control">
                  <option value="En attente">En attente</option>
                  <option value="Confirmer">Confirmer</option>
                  <option value="En préparation">En préparation</option>
                  <option value="En livraison">En livraison</option>
                  <option value="Livrer">Livrer</option>
                </select>
              </td>
            </tr>
            </tbody>
          </table>

          <!-- Pagination Controls -->
          <div class="pagination">

          </div>
        </div>
      </div>
    </div>

    <!-- Charts Section -->
    <div class="charts-container">
      <div class="chart-box">
        <h1 class="Titre">

           <!-- Diagramm en barre ici-->

      <div class="chart-box">
        <h1 class="Titre">

        </h1>
                 <!-- Diagramm en cercle ici-->

      </div>
    </div>
